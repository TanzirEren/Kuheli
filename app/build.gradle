plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.kuheli.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.kuheli.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            // Chaquopy requires explicit ABIs. arm64 covers nearly all modern phones.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Only used when the CI provides a keystore through environment variables.
            def ks = System.getenv('KULI_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KULI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KULI_KEY_ALIAS')
                keyPassword System.getenv('KULI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KULI_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            // Prebuilt nodejs-mobile libraries (fetched by scripts/fetch_nodejs_mobile.sh in CI).
            jniLibs.srcDirs += ['libnode/bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        buildPython 'python3'
        // The Python core uses only the standard library, so no pip packages are needed.
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.core:core:1.13.1'

    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
}
