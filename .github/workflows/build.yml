name: Build Kuheli APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      embed_node:
        description: 'Try to embed the nodejs-mobile runtime (experimental)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.KULI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 15 needs a build-time Python between 3.8 and 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Use the Android SDK that is already on the runner. (android-actions/setup-android
      # runs `sdkmanager tools`, which no longer exists, and crashes.)
      - name: Install SDK pieces
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-34" \
                        "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Self-test the Python core and the Node bridge
        run: |
          python3 -m py_compile app/src/main/python/kuheli_core.py
          node --check app/src/main/assets/nodejs-project/bridge.js
          python3 scripts/selftest.py

      - name: Fetch nodejs-mobile (experimental, off by default)
        if: ${{ inputs.embed_node }}
        run: bash scripts/fetch_nodejs_mobile.sh

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK (only if a keystore secret exists)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KULI_KEYSTORE_PASSWORD: ${{ secrets.KULI_KEYSTORE_PASSWORD }}
          KULI_KEY_ALIAS: ${{ secrets.KULI_KEY_ALIAS }}
          KULI_KEY_PASSWORD: ${{ secrets.KULI_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kuheli.jks"
          KULI_KEYSTORE="$RUNNER_TEMP/kuheli.jks" gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kuheli-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
